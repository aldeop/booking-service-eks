apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "booking-service.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    # Named so the ServiceMonitor can reference it by name rather than
    # number -- that's how ServiceMonitor's endpoints[].port field works.
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
  selector:
    {{- include "booking-service.selectorLabels" . | nindent 4 }}
