apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "booking-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "booking-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "booking-service.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- if or .Values.affinity.nodeAffinity.enabled (ne .Values.affinity.podAntiAffinity.type "none") }}
      affinity:
        {{- if .Values.affinity.nodeAffinity.enabled }}
        # required: a pod can ONLY schedule on a node carrying this label --
        # note this is "requiredDuringScheduling IgnoredDuringExecution":
        # the "IgnoredDuringExecution" half means removing the label later
        # does NOT evict pods already running there, it only blocks NEW
        # scheduling decisions.
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: {{ .Values.affinity.nodeAffinity.label }}
                    operator: In
                    values:
                      - {{ .Values.affinity.nodeAffinity.value | quote }}
        {{- end }}
        {{- if eq .Values.affinity.podAntiAffinity.type "hard" }}
        # required: a pod can ONLY schedule on a node with no other
        # booking-service pod already on it. Guarantees real spread (no
        # single node failure takes out more than one replica) but means
        # replicaCount can never exceed the node count -- scheduling fails
        # outright rather than degrading to a worse spread.
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "booking-service.selectorLabels" . | nindent 18 }}
              topologyKey: "kubernetes.io/hostname"
        {{- else if eq .Values.affinity.podAntiAffinity.type "soft" }}
        # preferred: the scheduler tries for the same spread as above, but
        # will still place a pod on an already-occupied node rather than
        # leave it Pending once every node has one.
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "booking-service.selectorLabels" . | nindent 20 }}
                topologyKey: "kubernetes.io/hostname"
        {{- end }}
      {{- end }}
      {{- if .Values.tolerations.enabled }}
      tolerations:
        - key: {{ .Values.tolerations.key }}
          operator: Equal
          value: {{ .Values.tolerations.value | quote }}
          effect: {{ .Values.tolerations.effect }}
          {{- if .Values.tolerations.tolerationSeconds }}
          tolerationSeconds: {{ .Values.tolerations.tolerationSeconds }}
          {{- end }}
      {{- end }}
      {{- if .Values.image.pullSecretName }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecretName }}
      {{- end }}
      containers:
        - name: booking-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          env:
            - name: DATABASE_HOST
              value: {{ .Values.database.host | quote }}
            - name: DATABASE_PORT
              value: {{ .Values.database.port | quote }}
            - name: DATABASE_NAME
              value: {{ .Values.database.name | quote }}
            - name: DATABASE_SECRET_ARN
              value: {{ .Values.database.secretArn | quote }}
            - name: AWS_REGION
              value: {{ .Values.database.awsRegion | quote }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
