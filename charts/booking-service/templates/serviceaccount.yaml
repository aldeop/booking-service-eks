apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "booking-service.labels" . | nindent 4 }}
  annotations:
    # Real bug hit 2026-08-23: pre-install hooks run BEFORE any of a
    # chart's regular templates, including this ServiceAccount -- without
    # its own earlier-weighted hook, the migration Job's pod got rejected
    # with "serviceaccount booking-service/booking-service not found" on
    # every retry, since the SA simply didn't exist yet when the Job's pod
    # was admitted. Giving this its own pre-install/pre-upgrade hook with a
    # lower weight (-5 vs the migration Job's 0) guarantees it's created
    # first. No hook-succeeded in the delete-policy -- unlike the migration
    # Job, this needs to stick around afterward for the Deployment to use.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- if .Values.serviceAccount.roleArn }}
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.roleArn }}
    {{- end }}
