{{- if .Values.migration.enabled }}
# Runs `alembic upgrade head` and BLOCKS the rest of the release until it
# succeeds -- pre-install/pre-upgrade hooks run to completion before Helm
# touches the Deployment, so the app can never start against a schema it
# doesn't expect yet. This is the Helm-native version of the same pattern
# k8s/migration-job.yaml implemented by hand (see that file's header for
# the older, pre-Helm approach and why it's now superseded).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  labels:
    {{- include "booking-service.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    # before-hook-creation: deletes the previous run's (immutable) Job
    # before creating this one -- without this, the second `helm upgrade`
    # would fail trying to create a Job that already exists.
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- if .Values.image.pullSecretName }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecretName }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_HOST
              value: {{ .Values.database.host | quote }}
            - name: DATABASE_PORT
              value: {{ .Values.database.port | quote }}
            - name: DATABASE_NAME
              value: {{ .Values.database.name | quote }}
            - name: DATABASE_SECRET_ARN
              value: {{ .Values.database.secretArn | quote }}
            - name: AWS_REGION
              value: {{ .Values.database.awsRegion | quote }}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
{{- end }}
