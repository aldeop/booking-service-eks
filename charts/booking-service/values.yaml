image:
  repository: ghcr.io/aldeop/booking-service
  tag: latest
  pullPolicy: IfNotPresent
  # Name of a docker-registry Secret already created in the target
  # namespace -- required for GHCR since packages are private by default.
  # Leave blank for a public registry (e.g. local testing against ECR).
  pullSecretName: ""

replicaCount: 2

service:
  port: 80
  targetPort: 8000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# serviceAccount.name is deliberately NOT derived from the Helm release name
# -- the Terraform IRSA trust policy (terraform/main.tf) hardcodes the trust
# condition to "system:serviceaccount:booking-service:booking-service", so
# this name must stay fixed regardless of what release name is used.
serviceAccount:
  name: booking-service
  # From `terraform output irsa_role_arn` after `terraform apply`. Leave
  # blank to deploy without IRSA (e.g. database.secretArn also left blank
  # and DATABASE_USER/PASSWORD supplied some other way).
  roleArn: ""

database:
  host: ""
  port: 5432
  name: booking
  # From `terraform output db_secret_arn` -- ARN of the RDS-managed
  # Secrets Manager secret holding {"username": ..., "password": ...}.
  secretArn: ""
  awsRegion: us-east-1

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 50

podDisruptionBudget:
  enabled: true
  minAvailable: 1

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 10

migration:
  enabled: true

affinity:
  podAntiAffinity:
    # "hard" | "soft" | "none"
    type: none
  nodeAffinity:
    enabled: false
    label: booking-service-primary
    value: "true"

tolerations:
  enabled: false
  key: dedicated
  value: booking-service
  effect: NoSchedule
  # Only meaningful when effect is NoExecute -- how long an already-running
  # pod is allowed to stay after the taint is applied, before eviction.
  # null means "tolerate indefinitely."
  tolerationSeconds: null

serviceMonitor:
  enabled: false
  # Must match the Helm release name kube-prometheus-stack was installed
  # under -- its default Prometheus only scrapes ServiceMonitors carrying
  # this exact release label.
  prometheusReleaseLabel: kube-prometheus-stack

grafanaDashboard:
  enabled: false
