# Real values for the Pluralsight sandbox session currently in progress.
# Committed (unlike values-sandbox-local.yaml) because ArgoCD syncs from
# git and has no other way to see these -- update and commit this file
# fresh each session, same as you'd update values-sandbox-local.yaml for
# manual helm installs. These are ARNs/hostnames, not credentials: knowing
# an ARN grants no access without real AWS permissions behind it, so this
# isn't a secret leak, just config that goes stale the moment the sandbox
# resets (same as any other environment-specific value).
image:
  # Pinned to the commit CI actually built and pushed, not `latest` --
  # `latest` is mutable, so its underlying digest can change without the
  # rendered manifest text changing at all, which means ArgoCD has nothing
  # to diff/sync and imagePullPolicy: IfNotPresent means nodes won't
  # re-pull it either. Nothing here would ever roll out automatically on a
  # tag like `latest` -- this is exactly why real GitOps pins to immutable
  # references. Bump this to the new commit SHA every time you actually
  # want a deploy to happen.
  tag: a5418a77c0632e626f9ec41dffca5096cf71c78a
  pullSecretName: ghcr-pull-secret

database:
  host: booking-service-db.cg1uo8ke8sfe.us-east-1.rds.amazonaws.com
  secretArn: "arn:aws:secretsmanager:us-east-1:495732660211:secret:rds!db-23f30288-ade1-4b31-af3e-eaefd4b60761-paVwJO"

serviceAccount:
  roleArn: arn:aws:iam::495732660211:role/booking-service-irsa

serviceMonitor:
  enabled: true

grafanaDashboard:
  enabled: true
