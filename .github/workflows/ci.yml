name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  build-and-push:
    runs-on: ubuntu-latest
    needs: [lint, test]
    # Only publish a real image from main -- PRs still get full lint+test
    # coverage above, but shouldn't push a GHCR image for every branch.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          # Explicit even though ubuntu-latest runners are already amd64 --
          # a local arm64 build silently failing on amd64 EKS nodes ("no
          # match for platform in manifest") was a real bug hit repeatedly
          # earlier in this project. Stated here deliberately, not just
          # following convention.
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/booking-service:latest
            ghcr.io/${{ github.repository_owner }}/booking-service:${{ github.sha }}
