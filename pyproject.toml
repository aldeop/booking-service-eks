[tool.ruff]
target-version = "py312"
line-length = 100
# Auto-generated by `alembic revision --autogenerate` -- not hand-formatted,
# so don't fight the linter over its import order every time a new
# migration is generated.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I"]
